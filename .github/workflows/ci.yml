name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - name: Reset local database
        shell: bash
        run: |
          set +e
          output="$(npm run db:reset 2>&1)"
          exit_code=$?
          if [ "$exit_code" -ne 0 ] && printf '%s\n' "$output" | grep -q 'Error status 502'; then
            printf '%s\n' "$output"
            printf '%s\n' 'Supabase restart returned 502; retrying the local reset once.'
            sleep 5
            retry_output="$(npm run db:reset 2>&1)"
            exit_code=$?
            output="$output

          --- retry ---
          $retry_output"
          fi
          printf '%s\n' "$output"
          if [ "$exit_code" -ne 0 ]; then
            annotation="$(printf '%s\n' "$output" | tail -n 80 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            printf '::error title=Database reset failed::%s\n' "$annotation"
            exit "$exit_code"
          fi
      - run: npm run db:buckets:seed
      - run: npm run db:lint
      - run: npm run db:test
      - run: npm run db:types:check
      - run: npm run typecheck
      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
